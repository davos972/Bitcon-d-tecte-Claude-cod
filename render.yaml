# Render Blueprint — déploiement permanent de BTC Markov.
# Backend = Web Service (always-on) avec disque persistant pour le tracker.
# Frontend = Static Site (build web statique d'Expo).
# Voir DEPLOY.md pour la procédure pas à pas.
services:
  # ---- Backend FastAPI -----------------------------------------------------
  - type: web
    name: btc-markov-backend
    runtime: python
    rootDir: backend
    plan: starter            # always-on (pas de mise en veille)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tracker-data
      mountPath: /data       # le store du tracker vit ici, survit aux redéploiements
      sizeGB: 1
    envVars:
      - key: TRACKER_DATA_DIR
        value: /data
      - key: CRYPTOCOMPARE_API_KEY
        sync: false          # à renseigner dans le dashboard (valeur de backend/.env)
      - key: TRACKER_API_KEY
        sync: false          # protège POST/DELETE /api/tracker — MÊME valeur que
                             # EXPO_PUBLIC_TRACKER_KEY du frontend ci-dessous
      - key: TRACKER_SCHEDULER
        value: "1"           # tracker serveur autonome 24/7 (Option B) : le backend
                             # enregistre + réconcilie les prédictions sans client
                             # ouvert. Mettre "0" pour revenir au client-only.

  # ---- Frontend Expo web (statique) ---------------------------------------
  - type: web
    name: btc-markov-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false          # = URL du backend Render (ex. https://btc-markov-backend.onrender.com)
      - key: EXPO_PUBLIC_TRACKER_KEY
        sync: false          # MÊME valeur que TRACKER_API_KEY du backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
